<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nokia Quote Generator</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: "NokiaFont";
      src: url("https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Font/nokia-6000-series-medium.ttf");
    }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
    }

    .neo-box {
      border: 4px solid black;
      background: white;
      box-shadow: 6px 6px 0 black;
    }

    .canvas-area {
      width: 360px;
      height: 480px;
      position: relative;
      overflow: hidden;
      border: 4px solid black;
      box-shadow: 10px 10px 0 black;
      background-size: cover;
      background-position: center;
      font-family: "NokiaFont";
    }
  </style>
</head>

<body class="p-6">

  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-6">

    <!-- CONTROL PANEL -->
    <div class="neo-box p-4 space-y-3">
      <h1 class="text-xl font-bold">Nokia Quote Generator</h1>

      <input id="header" class="w-full border-2 border-black p-2" placeholder="Header text" value="Ditzzx"/>

      <textarea id="pesan" class="w-full border-2 border-black p-2 h-28">
Jangan pernah menyerah pada impianmu hanya karena prosesnya terasa lama...
      </textarea>

      <input id="sender" class="w-full border-2 border-black p-2" value="Ditzzx"/>
      <input id="date" class="w-full border-2 border-black p-2" value="02/05/2026"/>
      <input id="time" class="w-full border-2 border-black p-2" value="11:28"/>

      <button onclick="render()" class="w-full neo-box p-2 font-bold">
        Render Preview
      </button>

      <button onclick="download()" class="w-full neo-box p-2 font-bold bg-black text-white">
        Download PNG
      </button>
    </div>

    <!-- PREVIEW -->
    <div class="flex justify-center items-start">
      <div id="canvas" class="canvas-area" style="background-image:url('https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Image/file_00000000a9f47208a295c9c984f92b7a.jpeg')">

        <!-- HEADER -->
        <div id="headerBox"
          style="position:absolute; top:30px; width:100%; text-align:center; font-size:28px; color:#E8F0F0; font-weight:bold;">
        </div>

        <!-- PESAN -->
        <div id="pesanBox"
          style="position:absolute; top:120px; left:20px; right:20px; font-size:16px; line-height:1.4; color:black;">
        </div>

        <!-- INFO -->
        <div id="infoBox"
          style="position:absolute; bottom:40px; left:20px; font-size:14px;">
        </div>

      </div>
    </div>

  </div>

<script>
function wrapText(text, maxChars = 38) {
  const words = text.split(" ");
  let lines = [];
  let line = "";

  for (let w of words) {
    const test = line ? line + " " + w : w;

    if (test.length > maxChars) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }

  if (line) lines.push(line);
  return lines;
}

function render() {
  const header = document.getElementById("header").value;
  const pesan = document.getElementById("pesan").value;
  const sender = document.getElementById("sender").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  const canvas = document.getElementById("canvas");

  // ================= HEADER (FIXED fake bold, no stacking bug)
  const headerBox = document.getElementById("headerBox");
  headerBox.innerHTML = "";

  const baseHeader = document.createElement("div");
  baseHeader.style.position = "relative";
  baseHeader.style.fontSize = "34px";
  baseHeader.style.fontWeight = "900";
  baseHeader.style.color = "#E8F0F0";
  baseHeader.style.textAlign = "center";
  baseHeader.innerText = header;

  headerBox.appendChild(baseHeader);

  // ================= BODY (AUTO SCALE LIKE CANVAS)
  const pesanBox = document.getElementById("pesanBox");

  const lines = wrapText(pesan, 42);

  // auto font size logic (mirip getFitFontSize)
  let fontSize = 22;
  const maxLines = 10;

  if (lines.length > maxLines) {
    fontSize = 16;
  } else if (lines.length > 6) {
    fontSize = 18;
  }

  pesanBox.style.fontSize = fontSize + "px";
  pesanBox.style.lineHeight = (fontSize * 1.4) + "px";

  pesanBox.innerHTML = lines.map(l => `<div>${l}</div>`).join("");

  // ================= FOOTER (FIXED positioning relative to body)
  const infoBox = document.getElementById("infoBox");

  infoBox.style.position = "absolute";

  // penting: jangan bottom fixed, tapi relative dari content
  const baseTop = 480 - 120; // bukan hard bottom lagi

  infoBox.style.top = baseTop + "px";
  infoBox.style.left = "20px";
  infoBox.style.right = "20px";

  infoBox.innerHTML = `
    <div>Dari: ${sender}</div>
    <div>${date} • ${time}</div>
  `;
}

async function download() {
  const el = document.getElementById("canvas");

  const canvas = await html2canvas(el, {
    useCORS: true,
    scale: 2
  });

  const link = document.createElement("a");
  link.download = "nokia-quote.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

render();
</script>
</body>
</html>
