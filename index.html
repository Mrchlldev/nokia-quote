<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nokia Quote Generator Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
body {
  background:#0b0b0f;
  color:white;
}

/* container scaling wrapper */
#stage {
  width:1086px;
  height:1448px;
  position:relative;
  overflow:hidden;
  transform:scale(0.45);
  transform-origin:top left;
}

/* background image */
#bg {
  position:absolute;
  inset:0;
  background-image:url("https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Image/file_00000000a9f47208a295c9c984f92b7a.jpeg");
  background-size:cover;
}

/* particle canvas */
canvas#particles {
  position:absolute;
  inset:0;
  z-index:1;
}

/* content layer */
#content {
  position:absolute;
  inset:0;
  z-index:2;
}

/* card feel (NEO BUT CLEAN) */
.neo {
  position:absolute;
  border:4px solid black;
  box-shadow:10px 10px 0 black;
  background:rgba(255,255,255,0.92);
}
</style>
</head>

<body class="p-6">

<div class="flex gap-6">

<!-- CONTROL -->
<div class="w-[320px] space-y-3">
  <div class="neo p-3 text-black">
    <div class="font-bold mb-2">CONTROL</div>

    <input id="header" class="w-full border p-2 mb-2 text-black" value="Ditzzx"/>

    <textarea id="pesan" class="w-full border p-2 h-32 text-black">
Jangan pernah menyerah pada impianmu hanya karena prosesnya terasa lama dan melelahkan...
    </textarea>

    <input id="sender" class="w-full border p-2 mt-2 text-black" value="Ditzzx"/>
    <input id="date" class="w-full border p-2 mt-2 text-black" value="02/05/2026"/>
    <input id="time" class="w-full border p-2 mt-2 text-black" value="11:28"/>

    <button onclick="render()" class="w-full mt-3 bg-black text-white p-2">
      Render
    </button>

    <button onclick="download()" class="w-full mt-2 bg-white text-black p-2 border">
      Download PNG
    </button>
  </div>
</div>

<!-- STAGE -->
<div class="neo">
  <div id="stage">

    <div id="bg"></div>
    <canvas id="particles"></canvas>

    <div id="content">

      <!-- HEADER (SAMA PERSIS COORD SCRAPER) -->
      <div id="headerBox"
        style="position:absolute; left:543px; top:200px; transform:translate(-50%,-50%); font-size:130px; font-family:'Archivo Black'; color:#E8F0F0;">
      </div>

      <!-- PESAN -->
      <div id="pesanBox"
        style="position:absolute; left:30px; top:300px; width:1000px; font-family:'Space Grotesk'; font-size:63px; line-height:110px; color:black;">
      </div>

      <!-- INFO -->
      <div id="infoBox"
        style="position:absolute; left:30px; top:980px; font-family:'Space Grotesk'; font-size:48px; color:black;">
      </div>

    </div>

  </div>
</div>

</div>

<script>
/* ================= PARTICLES BACKGROUND ================= */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = 1086;
  canvas.height = 1448;
}
resize();

let particles = Array.from({length:40},()=>({
  x:Math.random()*1086,
  y:Math.random()*1448,
  r:Math.random()*6+2,
  dx:(Math.random()-0.5)*1,
  dy:(Math.random()-0.5)*1
}));

function animate(){
  ctx.clearRect(0,0,1086,1448);

  for(let p of particles){
    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0||p.x>1086) p.dx*=-1;
    if(p.y<0||p.y>1448) p.dy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.15)";
    ctx.fill();
  }

  requestAnimationFrame(animate);
}
animate();

/* ================= SCRAPER LOGIC (1:1 STYLE) ================= */

function wrap(text, max=38){
  const words=text.split(" ");
  let line="",out=[];
  for(let w of words){
    let test=line?line+" "+w:w;
    if(test.length>max){ out.push(line); line=w; }
    else line=test;
  }
  if(line) out.push(line);
  return out;
}

function render(){

  const HEADER={
    text:document.getElementById("header").value
  };

  const PESAN=document.getElementById("pesan").value;
  const INFO={
    sender:document.getElementById("sender").value,
    date:document.getElementById("date").value,
    time:document.getElementById("time").value
  };

  /* HEADER (exact position like scraper) */
  document.getElementById("headerBox").innerText=HEADER.text;

  /* PESAN (wrap like canvas logic simplified) */
  const lines=wrap(PESAN,45);
  document.getElementById("pesanBox").innerHTML=
    lines.map(l=>`<div>${l}</div>`).join("");

  /* INFO */
  document.getElementById("infoBox").innerHTML=
    `Dari: ${INFO.sender}<br>${INFO.date}<br>${INFO.time}`;
}

/* ================= EXPORT ================= */
async function download(){
  const el=document.getElementById("stage");

  const canvas=await html2canvas(el,{
    scale:2,
    useCORS:true
  });

  const a=document.createElement("a");
  a.download="nokia-quote.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
}

render();
</script>

</body>
</html>
