<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nokia Quote Neo Brutal Rounded</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>

<style>
body{
  background:#0b0b12;
  color:white;
}

/* STAGE (NO SCALE BUG, FIXED SYSTEM) */
#stage{
  width:1086px;
  height:1448px;
  position:relative;
  overflow:hidden;
  border-radius:32px;
  box-shadow:18px 18px 0 black;
  border:4px solid black;
}

/* BACKGROUND */
#bg{
  position:absolute;
  inset:0;
  background:url("https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Image/file_00000000a9f47208a295c9c984f92b7a.jpeg");
  background-size:cover;
}

/* PARTICLES */
canvas{
  position:absolute;
  inset:0;
  z-index:1;
}

/* CONTENT */
#content{
  position:absolute;
  inset:0;
  z-index:2;
}

/* NEO BRUTAL SOFT CARD STYLE */
.neo{
  border-radius:28px;
  border:4px solid black;
  box-shadow:10px 10px 0 black;
  background:rgba(255,255,255,0.92);
}

/* FLOAT ANIMATION */
.float{
  animation: float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
</style>
</head>

<body class="p-6 flex gap-6">

<!-- CONTROL -->
<div class="w-[300px] space-y-2 neo p-3 text-black">
  <input id="h" class="w-full border p-2" value="Ditzzx"/>
  <textarea id="p" class="w-full border p-2 h-32">
Jangan pernah menyerah pada impianmu hanya karena prosesnya terasa lama...
  </textarea>

  <input id="s" class="w-full border p-2" value="Ditzzx"/>
  <input id="d" class="w-full border p-2" value="02/05/2026"/>
  <input id="t" class="w-full border p-2" value="11:28"/>

  <button onclick="render()" class="w-full bg-black text-white p-2 rounded-xl mt-2">
    Render
  </button>

  <button onclick="download()" class="w-full bg-white text-black p-2 rounded-xl border">
    Download
  </button>
</div>

<!-- STAGE -->
<div id="stage">

  <div id="bg"></div>
  <canvas id="pt"></canvas>

  <div id="content">

    <!-- HEADER (SCRAPER EXACT POSITION) -->
    <div id="header"
      style="position:absolute; left:543px; top:200px;
      transform:translate(-50%,-50%);
      font-family:'Archivo Black';
      font-size:130px;
      color:#E8F0F0;"
      class="float">
    </div>

    <!-- BODY -->
    <div id="body"
      style="position:absolute; left:30px; top:300px;
      width:1020px;
      font-family:'Space Grotesk';
      font-size:63px;
      line-height:110px;
      color:black;">
    </div>

    <!-- INFO -->
    <div id="info"
      style="position:absolute; left:30px; top:980px;
      font-family:'Space Grotesk';
      font-size:48px;
      color:black;">
    </div>

  </div>
</div>

<script>

/* ================= PARTICLE ================= */
const c=document.getElementById("pt");
const x=c.getContext("2d");
c.width=1086;c.height=1448;

let p=Array.from({length:35},()=>({
  x:Math.random()*1086,
  y:Math.random()*1448,
  r:Math.random()*6+2,
  dx:(Math.random()-0.5)*1.2,
  dy:(Math.random()-0.5)*1.2
}));

function anim(){
  x.clearRect(0,0,1086,1448);
  for(let i of p){
    i.x+=i.dx;i.y+=i.dy;
    if(i.x<0||i.x>1086)i.dx*=-1;
    if(i.y<0||i.y>1448)i.dy*=-1;

    x.beginPath();
    x.arc(i.x,i.y,i.r,0,Math.PI*2);
    x.fillStyle="rgba(255,255,255,0.15)";
    x.fill();
  }
  requestAnimationFrame(anim);
}
anim();

/* ================= SCRAPER STYLE LOGIC ================= */
function wrap(t,n=45){
  let w=t.split(" "),l="",r=[];
  for(let i of w){
    let c=l?l+" "+i:i;
    if(c.length>n){r.push(l);l=i;}
    else l=c;
  }
  if(l)r.push(l);
  return r;
}

function render(){

  document.getElementById("header").innerText =
    document.getElementById("h").value;

  const lines = wrap(document.getElementById("p").value,45);

  document.getElementById("body").innerHTML =
    lines.map(v=>`<div>${v}</div>`).join("");

  document.getElementById("info").innerHTML =
    `Dari: ${document.getElementById("s").value}<br>
     ${document.getElementById("d").value}<br>
     ${document.getElementById("t").value}`;
}

/* ================= EXPORT ================= */
async function download(){
  const el=document.getElementById("stage");

  const canvas=await html2canvas(el,{
    scale:2,
    useCORS:true
  });

  const a=document.createElement("a");
  a.download="nokia-quote.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
}

render();
</script>

</body>
</html>
