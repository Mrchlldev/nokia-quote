<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nokia Quote Generator</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: "FontHeader";
      src: url("https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Font/nokia-6000-series-medium.ttf");
    }
    @font-face {
      font-family: "FontPesan";
      src: url("https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Font/nokia-6000-series-medium.ttf");
    }
    @font-face {
      font-family: "FontInfo";
      src: url("https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Font/nokia-6000-series-medium.ttf");
    }

    body {
      font-family: system-ui;
    }

    .neo {
      border: 4px solid black;
      box-shadow: 6px 6px 0 black;
      border-radius: 16px;
    }
  </style>
</head>

<body class="bg-yellow-200">

<!-- NAVBAR -->
<nav class="p-4 bg-white neo m-4 flex justify-between items-center">
  <h1 class="font-bold text-xl">📟 Nokia Quote Generator</h1>
</nav>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">

  <!-- INPUT CARD -->
  <div class="bg-white neo p-4 space-y-3">

    <input id="headerText" class="w-full border p-2 rounded" placeholder="Nama Header" value="Ditzzx"/>

    <textarea id="pesanText" class="w-full border p-2 rounded h-40">
Jangan pernah menyerah pada impianmu hanya karena prosesnya terasa lama dan melelahkan, karena semua yang besar selalu dimulai dari langkah kecil yang konsisten setiap harinya tanpa terkecuali meski tidak ada yang melihat perjuanganmu..
    </textarea>

    <input id="sender" class="w-full border p-2 rounded" placeholder="Sender" value="Ditzzx"/>

    <input id="tanggal" class="w-full border p-2 rounded" value="02/05/2026"/>

    <input id="jam" class="w-full border p-2 rounded" value="11:28"/>

    <button onclick="render()" class="bg-black text-white px-4 py-2 rounded w-full">
      Generate
    </button>

    <button onclick="downloadImage()" class="bg-green-600 text-white px-4 py-2 rounded w-full">
      Download PNG
    </button>

  </div>

  <!-- RESULT CARD -->
  <div class="bg-white neo p-4 flex justify-center items-center">

    <div id="canvasWrap" class="relative"
      style="width: 360px; transform: scale(0.4); transform-origin: top left;">

      <!-- SIMULASI CANVAS 1086x1448 -->
      <div id="canvas"
        style="
          width:1086px;
          height:1448px;
          position:relative;
          overflow:hidden;
          background:url('https://raw.githubusercontent.com/Ditzzx-vibecoder/Assets/main/Image/file_00000000a9f47208a295c9c984f92b7a.jpeg');
          background-size:cover;
        ">

        <!-- HEADER -->
        <div id="header"
          style="
            position:absolute;
            left:543px;
            top:200px;
            transform:translate(-50%,-50%);
            font-family:FontHeader;
            font-size:130px;
            color:#E8F0F0;
          ">
        </div>

        <!-- PESAN -->
        <div id="pesan"
          style="
            position:absolute;
            left:30px;
            top:300px;
            width:1026px;
            font-family:FontPesan;
            color:black;
            white-space:pre-wrap;
          ">
        </div>

        <!-- INFO -->
        <div id="info"
          style="
            position:absolute;
            left:30px;
            top:980px;
            font-family:FontInfo;
            color:black;
            font-size:48px;
          ">
        </div>

      </div>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer class="m-4 p-4 bg-white neo text-center">
  Author: <b>Marcellino F.A</b>
</footer>

<script>
const WIDTH = 1086;
const HEIGHT = 1448;

function setHeader(text){
  const el = document.getElementById("header");
  el.innerHTML = "";

  for (let i = 0; i <= 4; i++) {
    const span = document.createElement("div");
    span.innerText = text;
    span.style.position = "absolute";
    span.style.left = i + "px";
    span.style.top = "0px";
    el.appendChild(span);
  }
}

function wrapText(text, maxWidth, fontSize){
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = fontSize + "px FontPesan";

  const words = text.split(" ");
  let line = "";
  const result = [];

  for (let w of words) {
    const test = line + " " + w;
    if (ctx.measureText(test).width > maxWidth && line) {
      result.push(line);
      line = w;
    } else {
      line = test;
    }
  }

  if (line) result.push(line);
  return result;
}

function fitFontSize(textLines, maxHeight){
  let fontSize = 63;
  const lineHeightRatio = 110 / 63;

  while (fontSize > 10) {
    const lineHeight = fontSize * lineHeightRatio;
    const wrapped = textLines.flatMap(l =>
      wrapText(l, 1026, fontSize)
    );

    const totalH = wrapped.length * lineHeight;

    if (totalH <= maxHeight) break;
    fontSize--;
  }

  return fontSize;
}

function render(){
  const header = document.getElementById("headerText").value;
  const pesanRaw = document.getElementById("pesanText").value;
  const sender = document.getElementById("sender").value;
  const tanggal = document.getElementById("tanggal").value;
  const jam = document.getElementById("jam").value;

  setHeader(header);

  // PESAN
  const pesanEl = document.getElementById("pesan");
  const lines = pesanRaw.split("\n");

  const fitSize = fitFontSize(lines, 700);
  const lineHeight = fitSize * (110/63);

  const wrapped = lines.flatMap(l =>
    wrapText(l, 1026, fitSize)
  );

  pesanEl.style.fontSize = fitSize + "px";
  pesanEl.innerHTML = wrapped.map(l => `<div>${l}</div>`).join("");

  // INFO
  document.getElementById("info").innerHTML = `
    Dari:<br>
    ${sender}<br>
    ${tanggal}<br>
    ${jam}
  `;
}

async function downloadImage(){
  const el = document.getElementById("canvas");

  const canvas = await html2canvas(el, {
    scale: 2,
    useCORS: true
  });

  const link = document.createElement("a");
  link.download = "nokia-quote.png";
  link.href = canvas.toDataURL();
  link.click();
}

// initial render
render();
</script>

</body>
</html>
